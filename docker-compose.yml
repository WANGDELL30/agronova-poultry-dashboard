name: agronova-poultry

services:
  database:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agronova}
      POSTGRES_USER: ${POSTGRES_USER:-agronova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - agronova_timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agronova_network

  mqtt:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - '${MQTT_PORT:-1883}:1883'
    volumes:
      - ./infrastructure/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - agronova_mosquitto_data:/mosquitto/data
      - agronova_mosquitto_log:/mosquitto/log
    healthcheck:
      test:
        [
          'CMD',
          'mosquitto_pub',
          '-h',
          'localhost',
          '-p',
          '1883',
          '-t',
          'agronova/healthcheck',
          '-m',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - agronova_network

  # Vision inference. Not started by `docker compose up -d` (profiles).
  #   Mock (no GPU):  docker compose --profile inference up -d --build inference
  #   Real (NVIDIA):  docker compose --profile gpu up -d --build inference-gpu
  # Both bind the same host port: run only one at a time.
  inference:
    profiles: ['inference']
    build:
      context: ./apps/inference
    restart: unless-stopped
    environment:
      INFERENCE_MODE: mock
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
    ports:
      - '${INFERENCE_PORT:-8000}:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agronova_network

  inference-gpu:
    profiles: ['gpu']
    build:
      context: ./apps/inference
      args:
        INSTALL_REAL: '1'
    restart: unless-stopped
    environment:
      INFERENCE_MODE: real
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_ADAPTER_REPO: ${HF_ADAPTER_REPO:-Arga23/chickenstress-vlm-lora}
      HF_BASE_MODEL: ${HF_BASE_MODEL:-Qwen/Qwen3-VL-4B-Instruct}
    ports:
      - '${INFERENCE_PORT:-8000}:8000'
    volumes:
      - agronova_hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # /health returns 503 until the model is fully loaded (several minutes on first run).
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - agronova_network

networks:
  agronova_network:
    name: agronova-poultry-network

volumes:
  agronova_timescaledb_data:
    name: agronova-poultry-timescaledb-data
  agronova_mosquitto_data:
    name: agronova-poultry-mosquitto-data
  agronova_mosquitto_log:
    name: agronova-poultry-mosquitto-log
  agronova_hf_cache:
    name: agronova-poultry-hf-cache
